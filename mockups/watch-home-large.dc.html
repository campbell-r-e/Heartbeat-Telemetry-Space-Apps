<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch home, large text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 520px; height: 520px; display: flex; align-items: center; justify-content: center; background: #1A1F29; font-family: Inter, sans-serif; color: #E8EDF6">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; background: #000; box-shadow: 0 0 0 14px #2B313C, 0 0 0 16px #3A4250; overflow: hidden">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<div style="{{d.style}}">
<span style="font-size: 26px; line-height: 1">{{d.sym}}</span>
<span style="font-size: 20px; font-weight: 700; color: #E8EDF6">{{d.name}}</span>
</div>
</sc-for>
<div style="position: absolute; left: 120px; top: 140px; width: 210px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700">15:02</span>
<span style="font-size: 20px; color: #9AA6BA">Sat 14 · 36%</span>
<span style="font-size: 24px; font-weight: 700; color: #FFC24B; margin-top: 4px">▲ 1 Watch</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { normal: ['#3DDC97', 'rgba(61,220,151,.16)', '●'], watch: ['#FFC24B', 'rgba(255,194,75,.18)', '▲'], none: ['#3A4250', '#10151F', '○'] };
    var raw = [
      { name: 'Vitals', k: 'none', left: 172, top: 8 },
      { name: 'Radiation', k: 'normal', left: 322, top: 92 },
      { name: 'Gravity', k: 'watch', left: 322, top: 254 },
      { name: 'Cabin', k: 'normal', left: 172, top: 338 },
      { name: 'Food', k: 'none', left: 22, top: 254 },
      { name: 'Mind', k: 'none', left: 22, top: 92 }
    ];
    return { dots: raw.map(function (d) { var c = C[d.k]; return { name: d.name, sym: c[2], style: 'position: absolute; left: ' + d.left + 'px; top: ' + d.top + 'px; width: 106px; height: 106px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: ' + c[1] + '; border: 2px solid ' + c[0] + '; color: ' + c[0] + '; box-sizing: border-box' }; }) };
  }
}
</script>
</body>
</html>
