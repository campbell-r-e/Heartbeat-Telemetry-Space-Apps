<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch readings: recovery and body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 520px; height: 520px; display: flex; align-items: center; justify-content: center; background: #1A1F29; font-family: Inter, sans-serif; color: #E8EDF6">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; background: #000; box-shadow: 0 0 0 14px #2B313C, 0 0 0 16px #3A4250; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #9AA6BA">14:05 · Sat, Nov 14 <svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x="0.5" y="0.5" width="18" height="11" rx="2" fill="none" stroke="#9AA6BA"></rect><rect x="2" y="2" width="10.5" height="8" rx="1" fill="#3DDC97"></rect><rect x="19.5" y="3.5" width="2" height="5" rx="1" fill="#9AA6BA"></rect></svg> 64%</span>
<span style="font-size: 20px; font-weight: 700">{{heading}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 310px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="{{t.style}}">
<span style="font-size: 12px; color: #9AA6BA; display: flex; justify-content: space-between; gap: 4px"><span>{{t.label}}</span><span style="{{t.symStyle}}">{{t.sym}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; line-height: 1.1">{{t.value}}<span style="font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: #9AA6BA"> {{t.unit}}</span></span>
<span style="font-size: 11px; color: #9AA6BA">{{t.sub}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 6px; margin-top: 4px" aria-hidden="true">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="4"><span style="{{p}}"></span></sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { normal: ['#3DDC97', '●'], watch: ['#FFC24B', '▲'], alert: ['#FF6B7A', '■'] };
    var raw = [
      { label: 'HRV (stress)', value: '38', unit: 'ms', sub: '−12% vs baseline', k: 'watch' },
      { label: 'Sleep', value: '5.6', unit: 'h', sub: '3-night average', k: 'watch' },
      { label: 'Exercise', value: '45', unit: '/120 min', sub: 'from movement sensor', k: 'watch' },
      { label: 'Muscle mass', value: '31.2', unit: 'kg', sub: 'body comp · −0.4 kg', k: 'normal' }
    ];
    var tiles = raw.map(function (t) { var c = C[t.k]; return Object.assign({}, t, { sym: c[1], symStyle: 'color: ' + c[0] + '; font-weight: 700', style: 'display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 16px; background: #10151F; border: 1px solid ' + (t.k === 'normal' ? '#253045' : c[0]) }); });
    var pages = [false, false, true, false].map(function (on) { return 'width: 8px; height: 8px; border-radius: 50%; background: ' + (on ? '#E8EDF6' : '#3A4250'); });
    return { heading: 'Recovery & body', tiles: tiles, pages: pages };
  }
}
</script>
</body>
</html>
