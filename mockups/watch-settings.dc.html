<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch connection settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 520px; height: 520px; display: flex; align-items: center; justify-content: center; background: #1A1F29; font-family: Inter, sans-serif; color: #E8EDF6">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; background: #000; box-shadow: 0 0 0 14px #2B313C, 0 0 0 16px #3A4250; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #9AA6BA">14:05 · Sat, Nov 14 <svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x="0.5" y="0.5" width="18" height="11" rx="2" fill="none" stroke="#9AA6BA"></rect><rect x="2" y="2" width="10.5" height="8" rx="1" fill="#3DDC97"></rect><rect x="19.5" y="3.5" width="2" height="5" rx="1" fill="#9AA6BA"></rect></svg> 64%</span>
<div style="display: flex; align-items: center; gap: 8px">
<a href="watch-cabin.dc.html" aria-label="Back to Cabin" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #9AA6BA">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<span style="font-size: 20px; font-weight: 700">Connection</span>
<span style="width: 36px" aria-hidden="true"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 310px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<button type="button" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 16px; background: #10151F; border: 1px solid #253045; color: #E8EDF6; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 12px; color: #9AA6BA">{{r.label}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.value}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA6BA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
<div style="{{statusStyle}}">
<span style="font-size: 14px; font-weight: 700">{{statusText}}</span>
<span style="font-size: 11px; color: #9AA6BA">{{statusSub}}</span>
</div>
<button type="button" onClick="{{test}}" style="height: 44px; padding: 0 22px; border-radius: 22px; border: 1px solid #7FB4FF; background: rgba(127,180,255,.16); color: #7FB4FF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{testLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { testing: false }; }
  renderVals() {
    var self = this;
    var testing = this.state.testing;
    return {
      rows: [
        { label: 'Server', value: '192.168.2.1:4000' },
        { label: 'Token', value: 'Saved ••••' },
        { label: 'Astronaut', value: 'a1 · Astronaut 1' }
      ],
      statusText: testing ? 'Testing…' : '● Connected',
      statusSub: testing ? 'Calling /api/health' : 'Last upload 14:04 · 12 readings',
      statusStyle: 'display: flex; flex-direction: column; align-items: center; gap: 1px; color: ' + (testing ? '#9AA6BA' : '#3DDC97'),
      testLabel: testing ? 'Testing…' : 'Test connection',
      test: function () { self.setState({ testing: true }); setTimeout(function () { self.setState({ testing: false }); }, 1200); }
    };
  }
}
</script>
</body>
</html>
