<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch readings: cabin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 520px; height: 520px; display: flex; align-items: center; justify-content: center; background: #1A1F29; font-family: Inter, sans-serif; color: #E8EDF6">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; background: #000; box-shadow: 0 0 0 14px #2B313C, 0 0 0 16px #3A4250; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #9AA6BA">14:05 · Sat, Nov 14 <svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x="0.5" y="0.5" width="18" height="11" rx="2" fill="none" stroke="#9AA6BA"></rect><rect x="2" y="2" width="10.5" height="8" rx="1" fill="#3DDC97"></rect><rect x="19.5" y="3.5" width="2" height="5" rx="1" fill="#9AA6BA"></rect></svg> 64%</span>
<span style="font-size: 20px; font-weight: 700">{{heading}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 310px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="{{t.style}}">
<span style="font-size: 12px; color: #9AA6BA; display: flex; justify-content: space-between; gap: 4px"><span>{{t.label}}</span><span style="{{t.symStyle}}">{{t.sym}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; line-height: 1.1">{{t.value}}<span style="font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: #9AA6BA"> {{t.unit}}</span></span>
<span style="font-size: 11px; color: #9AA6BA">{{t.sub}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 6px; margin-top: 4px" aria-hidden="true">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="4"><span style="{{p}}"></span></sc-for>
</div>
<a href="watch-settings.dc.html" aria-label="Connection settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #10151F; border: 1px solid #253045; color: #9AA6BA">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { normal: ['#3DDC97', '●'], watch: ['#FFC24B', '▲'], alert: ['#FF6B7A', '■'] };
    var raw = [
      { label: 'Pressure', value: '1013', unit: 'hPa', sub: 'watch barometer', k: 'normal' },
      { label: 'Noise', value: '58', unit: 'dBA', sub: 'watch microphone', k: 'normal' },
      { label: 'CO₂', value: '2.4', unit: 'mmHg', sub: 'from ship data', k: 'normal' },
      { label: 'Radiation', value: '6.8×', unit: 'rate', sub: 'from ship data', k: 'alert' }
    ];
    var tiles = raw.map(function (t) { var c = C[t.k]; return Object.assign({}, t, { sym: c[1], symStyle: 'color: ' + c[0] + '; font-weight: 700', style: 'display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 16px; background: #10151F; border: ' + (t.k === 'alert' ? '2px' : '1px') + ' solid ' + (t.k === 'normal' ? '#253045' : c[0]) }); });
    var pages = [false, false, false, true].map(function (on) { return 'width: 8px; height: 8px; border-radius: 50%; background: ' + (on ? '#E8EDF6' : '#3A4250'); });
    return { heading: 'Cabin', tiles: tiles, pages: pages };
  }
}
</script>
</body>
</html>
